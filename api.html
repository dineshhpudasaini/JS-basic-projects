<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserGenerator</title>
    <style>
        *{
            padding:0px;
            margin:0px;
            font-family:Arial, Helvetica, sans-serif;
            background:#c4fcef;
        }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:750px;
        }
        #box{
            height:500px;
            border: 4px solid #00c9a7;
            width:450px;
            border-radius:20px;
            display:flex;
            justify-content:center;
            align-items:center;
        } 
        #heading{
           padding-left:6px;
           margin-left:10px;
           font-size:40px;
           color:darkcyan;
        }
        #Name{
          font-size:30px;  
          margin:20px;
          padding:20px;
          background-color:#00c9a7;
          border-radius:30px;
        }
        .output{
            background-color:#00c9a7;
            background:#00c9a7;
            display:flex;
            align-items:center;
            justify-content:center;
            height:70px;
            width:200px;
            border:2px solid black;
            margin-top:40px;
            margin-left:100px;
            border-radius:20px;
            display:none;
        }
        span{
            background-color:#00c9a7;
        }
        button{
            border-radius:25px;
            padding:12px;
            margin-left:90px;
            background-color:#00c9a7;
        }
    </style>
</head>
<body>
    <div id = box>
    <div><h1 id ="heading">Generate username: </h1>
    <input id = "Name" type = "text" placeholder = "Name Here">
    <button id ="submit">Submit</button>
    <button id = "clear">Clear</button>
    <div class="output"><span> UserName </span></div>
    </div>
    </div>
    <script>
        const input = document.getElementById("Name");
const submit = document.getElementById("submit");
const clear = document.getElementById("clear");

const output = document.querySelector(".output");
const username = document.querySelector(".output span");


async function generateUser() {

    if (input.value === "") {
        alert("Please enter your name!");
        return;
    }

    try {

        const response = await fetch("https://randomuser.me/api/");

        const data = await response.json();

        const randomFirstName = data.results[0].name.first;

        const randomNumber = Math.floor(Math.random() * 1000);

        username.textContent =
            input.value + "_" + randomFirstName + randomNumber;

        output.style.display = "flex";

    } catch (error) {

        console.log(error);
        alert("Failed to generate username!");

    }
}


submit.addEventListener("click", generateUser);


clear.addEventListener("click", function () {

    input.value = "";
    username.textContent = "Username";
    output.style.display = "none";

});
    </script>
</body>
</html>
