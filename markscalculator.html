<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
    <style>
        *{
            margin: 0;
            padding:0;
            background-color: black;
            color: #fff;
        }
       h3{
        display: flex;
        justify-content: center;
        font-family:Verdana, Geneva, Tahoma, sans-serif;
        font-size: 50px;
        padding: 5px;
        margin-top: 10px;
       }
       h2{
        display: flex;
        font-family: 'Courier New', Courier, monospace;
        font-size: 30px;
        margin-left: 30px;
        margin-bottom: 30px;
        margin-top: 25px;
       }
       input{
        border-radius: 50px;
        font-size: 15px;
        margin: 16px;
        padding: 16px;
        display: block;
       }
       button{
        margin: 16px;
        padding: 10px;
        border: 2px solid orange;
        border-radius: 45px;
        font-family: 'Courier New', Courier, monospace;
        background-color: brown;
       }
    </style>
</head>
<body>
    <div class="form">
    <h3>Marks Calculator</h3>
    <input id="Subject" type="text" placeholder="Enter Your subject here: ">
    <input id ="marks" type="text" placeholder ="Enter Your marks here: ">
    <button>Next Subject</button>
    <button>Submit</button>
    </div>
    <script>
        document.getElementById("subject").innerHTML("hello");
    </script>
</body>
</html>
