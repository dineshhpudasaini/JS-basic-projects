<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            font-family:sans-serif;
        }
        body{
            background:#1B3C53;
            color:#D2C1B6;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .heading{
            display:flex;
            justify-content:center;
            font-size : 60px;
            padding-bottom:15px;
        }
        .container{
            margin:20px;
            padding:20px;
            width:600px;
            height:650px;
            border: 2px solid #456882;
            border-radius:10px;
            background:#456882;
        }
        button{
            margin:20px;
            margin-top:20px;
            padding:20px;
            font-size:30px;
            border-radius:25px;
            color:#234C6A;
            cursor:pointer;
            transition:all 0.3s;
        }
        button:hover{
            background-color:black;
            color:#fff;
        }
        .input{
            border:2px solid #fff;
            font-size:30px;
            width:595px;
            height:70px;
            border-radius:25px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        #clear{
            display : flex;
            align-items:center;
            justify-content: center;
        }
        .values{
            padding-left:30px;
            padding-top:15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">Calculator</h1>
        <div class="input">Enter Your Number Here:</div>
        <div class="values">
            <button >1</button>
            <button >2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
            <button>=</button>
                    </div>
           <div id="clear"> <button id = "clear">Clear</button></div>
    </div>
</body>

</html>
