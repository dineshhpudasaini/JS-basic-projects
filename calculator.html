<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            font-family:sans-serif;
        }
        body{
            background:#1B3C53;
            color:#D2C1B6;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .heading{
            display:flex;
            justify-content:center;
            font-size : 60px;
            padding-bottom:15px;
        }
        .container{
            margin:20px;
            padding:20px;
            width:600px;
            height:650px;
            border: 2px solid #456882;
            border-radius:10px;
            background:#456882;
        }
        button{
            margin:20px;
            margin-top:20px;
            padding:20px;
            font-size:30px;
            border-radius:25px;
            color:#234C6A;
            cursor:pointer;
            transition:all 0.3s;
        }
        button:hover{
            background-color:black;
            color:#fff;
        }
        .input{
            border:2px solid #fff;
            font-size:30px;
            width:595px;
            height:70px;
            border-radius:25px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        #clear{
            display : flex;
            align-items:center;
            justify-content: center;
        }
        .values{
            padding-left:30px;
            padding-top:15px;
        }
        #submit{
            border : 2px solid black;
            display:flex;
            height: 40px;
            width:60px;
            justify-content:center;
            align-items:center;
            border-radius:5px;
            background-color:white;
            font-size:40px;
            margin-left:440px;
            margin-top:-80px;
            cursor:pointer;
        }
        #clear{
            border : 2px solid black;
            display:flex;
            height: 60px;
            width:100px;
            justify-content:center;
            align-items:center;
            border-radius:5px;
            background-color:white;
            font-size:40px;
            margin:60px;
            margin-left:240px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">Calculator</h1>
        <div class="input">Enter Your Number Here:</div>
        <div class="values">
            <button >1</button>
            <button >2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
            <div id = "submit">=</div>
                    </div>
           <div id="clear">Clear</div>
    </div>
    <script>
        let input = document.querySelector(".input");
        let values = document.querySelector(".values");
        let buttons = document.querySelectorAll("button");
        let clear = document.getElementsById("clear");
        let operator= "";
        currentvalue = "";
        input.innerHTML="Hi";
        buttons.forEach(button =>{
        button.addEventListener("click",()=>{
            input.innerHTML =currentvalue + button.innerHTML ;
            currentvalue=currentvalue+button.innerHTML;
        })})
        function sum(a,b){
            return a+b;
        }
        function sub(a,b){
            return a-b;
        }
        function div(a,b){
            return a/b;
        }
        function multiply(a,b){
            return a*b;
        }
let submit = document.getElementById("submit");
submit.addEventListener("click",()=>{
    let addvalue=currentvalue.split("+");
    let subvalue=currentvalue.split("-");
    let multiplyvalue=currentvalue.split("*");
    let divvalue=currentvalue.split("/")
    if (currentvalue ===addvalue[0]+"+"+addvalue[1]){
    let firstvalue = addvalue[0];
    let lastvalue = addvalue[1];
    input.innerHTML = sum(Number(firstvalue),Number(lastvalue));}
    else if (currentvalue === subvalue[0]+"-"+subvalue[1]){
    let firstvalue = subvalue[0];
    let lastvalue = subvalue[1];
    input.innerHTML = sub(Number(firstvalue),Number(lastvalue));}
    else if (currentvalue ===multiplyvalue[0]+"*"+multiplyvalue[1]){
    let firstvalue = multiplyvalue[0];
    let lastvalue = multiplyvalue[1];
    input.innerHTML = multiply(Number(firstvalue),Number(lastvalue));}
    else if (currentvalue ===divvalue[0]+"/"+divvalue[1]){
    let firstvalue = divvalue[0];
    let lastvalue = Number(divvalue[1]);
       if(lastvalue === 0){
          alert("error");
       }else{
           input.innerHTML = div(Number(firstvalue),Number(lastvalue));}}
})
clear.addEventListener("click",()=>{
input.innerHTML="";
currentvalue="";
})
    </script>
</body>

</html>
