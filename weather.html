<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
   <style>
    *{
    margin : 0;
    padding : 0;
    font-family : 'Poppins', sans-serif;
    box-sizing : border-box;
}
body{
    background : #222;
}
.card{
    width :90%;
    max-width : 470px;
    background : linear-gradient(135deg, #00feba, #5b548a);
    color: #fff;
    margin : 100px auto 0;
    border-radius: 20px;
    padding : 40px;
    text-align: center;
}
.search{
    width: 100%;
    display :flex;
    align-items: center;
    justify-content: center;
}
.search input{
    border:0;
    outline:0;
    background: #ebfffc;
    color:#555;
    padding: 10px 25px;
    height: 60px;
    border-radius:30px;
    flex: 1;
    margin-right:16px;
    font-size: 18px;
}
.search button{
    border : 0;
    outline : 0;
    background : #ebfffc;
    border-radius : 50%;
    width : 60px;
    height : 60px;
    cursor : pointer;
}
.search button img{
    width : 30px;
}
.weather-icon{
    width : 170px;
    margin-top : 30px;
}
.weather h1{
    font-size: 80px;
    font-weight: 500;
}
.weather h2{
    font-size: 45px;
    font-weight: 400;
    margin-top: -10px;
}
.details{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    margin-top: 50px;
}
.col{
    display: flex;
    align-items: center;
    text-align:left;
}
.col img{
    width: 40px;
    margin-right: 10px;
}
.humidity, .wind{
    font-size: 28px;
    margin-top:-6px;
}
.weather{
    display:none;
}
.error{
    text-align: left;
    margin: left;
    font-size: 14px;
    margin-top: 10px;
    display: none;
}
   </style>
</head>
<body>
    <div class ="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck ="false">
            <button><img src="https://img.icons8.com/?size=100&id=21101&format=png&color=000000"></button>
        </div>
        <div class="error">
            <p>Invalid city Name</p>
        </div>
        <div class="weather">
            <img src = "https://img.icons8.com/?size=100&id=kKxyuLXD4w0n&format=png&color=000000" class = "weather-icon">
            <h1 class="weather-temp">22°C</h1>
            <h2 class = "city">Kathmandu</h2>
            <div class="details">
                <div class="col">
                    <img src = "https://img.icons8.com/?size=100&id=18585&format=png&color=000000">
                    <div>
                        <p class="humidity">50%</p>
                        <p> Humidity</p>
                    </div>
                </div>
                  <div class="col">
                    <img src = "https://img.icons8.com/?size=100&id=RtDA8YDN9Mi9&format=png&color=000000">
                    <div>
                        <p class="wind">15km/h</p>
                        <p> Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    const apikey ="2e0cb492ac6aabf3e08c2f57e342b178";
    const apiURL ="https://api.openweathermap.org/data/2.5/weather?&units=metric&q="
    const searchbox = document.querySelector(".search input");
    const searchBtn= document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon"); 
    
    async function checkweather(city){
        const response = await fetch(apiURL + city + `&appid=${apikey}`)
        if (response.status==404){
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
        }
        else{
        var data = await response.json();

        
        document.querySelector(".city").innerHTML =data.name;
        document.querySelector(".weather-temp").innerHTML =Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").innerHTML =data.main.humidity + "%";
        document.querySelector(".wind").innerHTML =data.wind.speed + "Km/h";
        if(data.weather[0].main=="Clouds"){
            weatherIcon.src = "https://img.icons8.com/?size=100&id=GCfP2zAOvciD&format=png&color=000000";
        }
        else if(data.weather[0].main=="Clear"){
            weatherIcon.src= "https://img.icons8.com/?size=100&id=18529&format=png&color=000000";
        }   
         else if(data.weather[0].main=="Rain"){
            weatherIcon.src= "https://img.icons8.com/?size=100&id=RX9Z5JXtipfx&format=png&color=000000";
        }
         else if(data.weather[0].main=="Drizzle"){
            weatherIcon.src= "https://img.icons8.com/?size=100&id=undefined&format=png&color=000000";
        }
          else if(data.weather[0].main=="Mist"){
            weatherIcon.src= "https://img.icons8.com/?size=100&id=uZEKm2OB54d1&format=png&color=000000";
        }
         document.querySelector(".weather").style.display = "block";
         document.querySelector(".error").style.display = "none";
          }

         }
    searchBtn.addEventListener("click",()=>{
        checkweather(searchbox.value);
    } )

    checkweather("kathmandu");
</script>






</body>
</html>
