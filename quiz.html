<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
*{
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    box-sizing: border-box;
}
 body{
    background: #45050C;
 }
 .app{
    background: #fff;
    width:60%;
    max-width:600px;
    margin : 100px auto 0;
    border-radius: 15px;
    padding : 90px;
}
.app h1{
    font-size: 25px;
    color:#8B6220;
    font-weight: 900;
    border-bottom: 1px solid ;
    padding-bottom : 10px;
    display:flex;
    justify-content:center;
}
.quiz{
    padding:20px 0;
    background : white;
}
.quiz h2{
    font-size: 18px;
    color: #8B6220;
    font-weight: 600;
    margin-top:10px;
}
.btn{
    background: #fff;
    color: #222;
    font-weight :500;
    width: 100%;
    border: 1px solid #222;
    padding: 10px;
    margin: 10px 0;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover:not([disabled]){
    background: #222;
    color: #EECF6D;
}
.btn:disabled{
    cursor:no-drop;
}
#next{
    background:#45050C;
    color: #EECF6D;
    font-weight: 500;
    width : 150px;
    border: 0;
    padding:10px;
    margin:20px auto 0;
    border-radius: 4px;
    cursor : pointer;
    display: none;
}
.correct{
    background:#9aeabc;
}
.incorrect{
    background:#ff9393;
}
    </style>
</head>
<body>
 <div class="app">
    <h1> Simple Quiz</h1>
    <div class="quiz">
        <h2 id = "question">Question goes here</h2>
       <div id="answerbutton">
        <button class="btn">Answer 1</button>
        <button class="btn">Answer 2</button>
        <button class="btn">Answer 3</button>
        <button class="btn">Answer 4</button>
       </div>
       <button id = "next">Next</button>
    </div>
 </div>
 <script>
    const questions = [
        {
            question:"What is the largest animal in the world?",
            answers:[
                {text : "shark", correct: false},
                {text : "Blue Whale", correct: true},
                {text : "Elephant", correct: false},
                {text : "Giraffe", correct: false}, 
            ]
        },
        {
            question:"What is the capital city of Nepal?",
            answers:[
                {text : "pokhara", correct: false},
                {text : "Kathmandu", correct: true},
                {text : "Lalitpur", correct: false},
                {text : "Biratnagar", correct: false}, 
            ]
        },
        {
            question:"What is the national flower of Nepal?",
            answers:[
                {text : "Rose", correct: false},
                {text : "Lotus", correct: false},
                {text : "Rhododendron", correct: true},
                {text : "Sunflower", correct: false}, 
            ]
        },
        {
            question:"Which is the highest mountain in the world?",
            answers:[
                {text : "Mount Everest", correct: true},
                {text : "K2", correct: false},
                {text : "Annapurna", correct: false},
                {text : "Dhaulagiri", correct: false}, 
            ]
        },
        {
            question:"What is the currency of Nepal?",
            answers:[
                {text : "Rupee", correct: true},
                {text : "Dollar", correct: false},
                {text : "Taka", correct: false},
                {text : "Yen", correct: false}, 
            ]
        },
        {
            question:"Which animal is the national animal of Nepal?",
            answers:[
                {text : "Tiger", correct: false},
                {text : "Cow", correct: true},
                {text : "Elephant", correct: false},
                {text : "Giraffe", correct: false}, 
            ]
        },
        {
            question:"How many provinces are there in Nepal?",
            answers:[
                {text : "5", correct: false},
                {text : "6", correct: false},
                {text : "7", correct: true},
                {text : "8", correct: false}, 
            ]
        },
        {
            question:"Which festival is known as the festival of lights in Nepal?",
            answers:[
                {text : "Dashain", correct: false},
                {text : "Tihar", correct: true},
                {text : "Holi", correct: false},
                {text : "Teej", correct: false}, 
            ]
        },
                {
            question:"What is the national bird of Nepal?",
            answers:[
                {text : "Peacock", correct: false},
                {text : "Danphe", correct: true},
                {text : "Eagle", correct: false},
                {text : "Parrot", correct: false}, 
            ]
        },
                {
            question:"Which is the birthplace of Lord Buddha?",
            answers:[
                {text : "Janakpur", correct: false},
                {text : "Lumbini", correct: true},
                {text : "Pokhara", correct: false},
                {text : "Pashupati", correct: false}, 
            ]
        },
                {
            question:"What is the national flag of Nepal famous for?",
            answers:[
                {text : "Being Circular", correct: false},
                {text : "Being Square", correct: false},
                {text : "Having two triangular shapes", correct: true},
                {text : "Having stars", correct: false}, 
            ]
        }
    ];

    const questionelement = document.getElementById("question");
    const answerbuttons = document.getElementById("answerbutton");
    const next = document.getElementById("next");

    let currentquestionindex = 0;
    let score = 0;

function startquiz(){
    currentquestionindex=0;
    score=0;
    next.innerHTML = "Next";
    showquestion();
}
function showquestion(){
    resetstate()
    let currentquestion = questions[currentquestionindex];
    let questionnumber = currentquestionindex + 1;
    questionelement.innerHTML = questionnumber + ". " + currentquestion.question;
    currentquestion.answers.forEach(answer =>{
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerbuttons.appendChild(button);
        if(answer.correct){
            button.dataset.correct = answer.correct;
        }
        button.addEventListener("click",selectAnswer);
    })
}
function resetstate(){
    next.style.display = "none";
    while(answerbuttons.firstChild){
        answerbuttons.removeChild(answerbuttons.firstChild);
    }
}
function selectAnswer(e){
    const selectBtn = e.target;
    const iscorrect = selectBtn.dataset.correct === "true";
    if(iscorrect){
        selectBtn.classList.add("correct");
        score++;
    }
    else{
        selectBtn.classList.add("incorrect");
    }
    Array.from(answerbuttons.children).forEach(button =>{
        if(button.dataset.correct  ==="true"){
            button.classList.add("correct");
        }
        button.disabled = true;
    });
    next.style.display = "block";
}
function showscore(){
    resetstate();
    questionelement.innerHTML = `you scored ${score} out of ${questions.length}!`;
    next.innerHTML = "Play Again";
    next.style.display = "block";
}
function handleNextButton(){
    currentquestionindex++;
    if(currentquestionindex<questions.length){
        showquestion();
    }
    else{
        showscore();
    }
}
next.addEventListener("click",()=>{
    if(currentquestionindex<questions.length){
        handleNextButton();
    }
    else{
        startquiz();
    }
})
startquiz();

 </script>
</body>
</html>
