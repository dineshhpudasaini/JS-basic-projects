<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYNC API</title>
</head>
<body>
    <h1></h1>
    <div class="time"></div>
    <div class="temperature"></div>
    <script>
        let h = document.querySelector("h1");
        let temperature = document.querySelector(".temperature");
        let time = document.querySelector(".time");
async function weather(){
    try{
    let response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=temperature_2m");
    let data = await response.json();
    time.innerHTML= data.hourly.time[0];
    temperature.innerHTML=data.hourly.temperature_2m[0];
    }
    catch(error){
        alert("error");
    }
}
h.innerHTML = "Working on it";
weather();

    </script>
</body>
</html>
