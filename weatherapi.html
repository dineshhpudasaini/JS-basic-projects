<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Weather</title>
</head>
<body>
    <div class="time"> </div>
    <div class="temperature"> </div>
    <script>
        let time = document.querySelector(".time");
        let temperature = document.querySelector(".temperature");
        let weather = fetch("https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=temperature_2m");
        weather.then((value)=>{
            return value.json();
        }).then((value)=>{
            console.log(value);
            time.innerHTML = value.hourly.time[0];
            temperature.innerHTML=value.hourly.temperature_2m[0];
        })
    </script>
</body>
</html>
