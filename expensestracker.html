<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <style>
        *{
            padding: 0px;
            margin:0px;
            font-family:system-ui;
            background:#E3FDFD;
            color:#71C9CE;
        }
        body{
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .transactions{
            margin-top:50px;
            height:600px;
            width:600px;
            border:4px solid #CBF1F5;
            border-radius:25%;
        }
        h1{
            margin-top:60px;
            margin-left:100px;
            font-size:40px;
            font-style:italic;
        }
        .income{
            font-size:20px;
            margin:60px;
        }
        input{
            border-radius:15px;
            margin:30px;
            padding:20px;
            
        }
        .expenses{
            font-size:20px;
            margin:30px;
        }
        .save{
             padding:10px;
            border-radius:15px;
            transition:all 0.3s;
        }
        .save:hover{
            background: #222;
            color: #EECF6D;
        }
        .submit{
            padding:11px;
            border-radius:20px;
            margin-left:150px;
            transition:all 0.3s;
        }
        .submit:hover{
            background: #222;
            color: #EECF6D;
        }
        .reset{
            padding:10px;
            border-radius:20px;
            margin-left:50px;
            transition:all 0.3s;
        }
        .reset:hover{
            background: #222;
            color: #EECF6D;
        }
    </style>
</head>
<body>
<div class="transactions">
        <h1>Expenses Tracker</h1>
    <div class="income">
        <h2>Please enter your total Income: </h2>
        <input placeholder = "Total Income Amount">
        <button class="save">Save</button>
    </div>
    <div class="expenses">
        <h2>Please enter the expenses Here: </h2>
        <input placeholder = "Expenses ">
        <input placeholder = "Expenses Amount">
        <button class="submit">Submit</button>
        <button class="reset">Reset All</button>
    </div>

</div>
</body>
</html>
