<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: system-ui;
            box-sizing: border-box;
        }

        body {
            background: #E3FDFD;
            color: #71C9CE;
            display: flex;
            justify-content: center;
        }

        .transactions {
            margin-top: 50px;
            min-height: 600px;
            width: 600px;
            border: 4px solid #CBF1F5;
            border-radius: 25px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            font-style: italic;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        input {
            border-radius: 15px;
            margin: 10px 0;
            padding: 15px;
            border: 2px solid #CBF1F5;
            outline: none;
        }

        .income input {
            width: 70%;
        }

        .expenses input {
            width: 45%;
        }

        button {
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #CBF1F5;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #222;
            color: #EECF6D;
        }

        .expenses {
            margin-top: 30px;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #CBF1F5;
            border-radius: 15px;
        }

        .summary p {
            margin: 10px 0;
            font-size: 18px;
        }

        #expenseList {
            margin-top: 20px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #CBF1F5;
            border-radius: 10px;
        }

        .delete {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
<div class="transactions">
        <h1>Expenses Tracker</h1>
    <div class="income">
        <h2>Please enter your total Income: </h2>
        <input id = "income" placeholder = "Total Income Amount" type = "number">
        <button class="save">Save</button>
    </div>
    <div class="expenses">
        <h2>Please enter the expenses Here: </h2>
        <input id = "expenses" placeholder = "Expense ">
        <input id = "expensesAmt" placeholder = "Expense Amount" type = "number">
        <button class="submit">Submit</button>
        <button class="reset">Reset All</button>

        <div class="summary">
        <p>Income: Rs. <span id="incomeDisplay">0</span></p>
        <p>Total Expenses: Rs. <span id="totalDisplay">0</span></p>
        <p>Remaining: Rs. <span id="remainingDisplay">0</span></p>
    </div>
        <div id="expenseList"></div>
    </div>
    <script>
        let income = 0;
        let expenses = [];

        const incomeInput =document.querySelector("#income");
        const saveIncome = document.querySelector(".save");

        const expenseName = document.querySelector("#expenses");
        const expenseAmount =document.querySelector("#expensesAmt");
        const submitExpense =document.querySelector(".submit");

        const incomeDisplay = document.getElementById("incomeDisplay");
        const totalDisplay  = document.getElementById("totalDisplay");
        const remainingDisplay = document.getElementById("remainingDisplay");

        const expenseList =document.getElementById("expenseList") ;


        saveIncome.addEventListener("click",function(){
            income = Number(incomeInput.value);
            incomeDisplay.textContent = income;
            updateTotal();
        });

        submitExpense.addEventListener("click",function(){
            let name = expenseName.value;
            let amount = Number(expenseAmount.value);

            if(name == ""|| amount<=0){
                alert("Please Enter a valid input");
                return;
            }
            let expense = {
                name : name,
                amount: amount
            };

            expenses.push(expense);

            displayExpenses();
            updateTotal();

            expenseName.value = "";
            expenseAmount.value = "";

        });

        function displayExpenses(){
            expenseList.innerHTML = "";
            expenses.forEach(function(expense,index){
                let div = document.createElement("div");
                div.className = "expense-item";

                div.innerHTML = `
                <span>
                    ${expense.name}: Rs. ${expense.amount}
                </span>
                <button class= "delete" onclick = "deleteExpense(${index})">
                    Delete
                </button>`;

                expenseList.appendChild(div);
            });
        }

        function updateTotal(){
            let total = 0;
            expenses.forEach(function (expense){
                total += expense.amount;
            });
            totalDisplay.textContent = total;
             let remaining = income - total;
            remainingDisplay.textContent = remaining;
        }
        function deleteExpense(index){
            expenses.splice(index,1);
            displayExpenses();
            updateTotal();
        }
        function resetall(){
                    let expenses = [];
                    let income = 0;
                    incomeInput.value="";
                    incomeInput.focus();
                    incomeDisplay.textContent = income;
                    expenseName.value = "";
                    expenseAmount.value = "";
                    expenseList.innerHTML = "";
                    displayExpenses();
                    total = 0;
                    deleteExpense();
                    updateTotal();
        }
 const reset = document.querySelector(".reset");
reset.addEventListener("click",()=>{
            resetall();
        })
    </script>
</div>
</body>
</html>
